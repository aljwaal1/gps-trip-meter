name: Build GPS Trip Meter Android 4.4
on:
  workflow_dispatch:
  push:
    branches: [android-4.4]
    paths: ['legacy-android-4.4/**', '.github/workflows/build-android-4.4.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-33' 'build-tools;33.0.2' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Build signed debug APK
        run: gradle -p legacy-android-4.4 clean assembleDebug --stacktrace --no-daemon
      - name: Save and verify APK
        run: |
          set -euo pipefail
          APK="$(find legacy-android-4.4/app/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/33.0.2/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p apk
          cp "$APK" apk/gps-trip-meter-android-4.4.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gps-trip-meter-android-4.4
          path: apk/gps-trip-meter-android-4.4.apk
      - name: Commit APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add apk/gps-trip-meter-android-4.4.apk
          git diff --cached --quiet || (git commit -m 'Build signed GPS Trip Meter Android 4.4 APK' && git push origin HEAD:android-4.4)
