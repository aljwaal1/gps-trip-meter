name: Build APK Direct

concurrency:
  group: build-apk-direct
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'apk/**'
      - 'DOWNLOAD_APK.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge GPS reliability fixes
        run: |
          python3 tools/merge_gps_error_cleanup.py
          python3 tools/merge_background_update_guard.py
          grep -q '_handlePositionError' lib/services/trip_session.dart
          grep -q 'await stopForeground()' lib/services/trip_session.dart
          grep -q '_backgroundUpdateInProgress' lib/services/trip_session.dart
          grep -q '_runBackgroundUpdateOnce' lib/services/trip_session.dart
          test -f test/gps_error_cleanup_contract_test.dart
          test -f test/background_update_guard_contract_test.dart

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter Android project
        run: |
          flutter --version
          flutter create --platforms=android --org com.explapp .
          rm -f test/widget_test.dart
          flutter pub get

      - name: Write Android Manifest
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="عداد رحلات GPS"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">

                  <service
                      android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                      android:foregroundServiceType="location"
                      android:exported="false" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Set Android minSdk
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            perl -0pi -e 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            perl -0pi -e 's/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
          fi

      - name: Format and analyze
        run: |
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Copy APK to apk folder
        run: |
          mkdir -p apk
          cp build/app/outputs/flutter-apk/app-release.apk apk/gps-trip-meter.apk

      - name: Update download file
        run: |
          echo "# تحميل التطبيق" > DOWNLOAD_APK.md
          echo "" >> DOWNLOAD_APK.md
          echo "آخر نسخة APK مباشرة:" >> DOWNLOAD_APK.md
          echo "" >> DOWNLOAD_APK.md
          echo "https://github.com/${{ github.repository }}/raw/main/apk/gps-trip-meter.apk" >> DOWNLOAD_APK.md

      - name: Commit merged source and APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/services/trip_session.dart apk/gps-trip-meter.apk DOWNLOAD_APK.md
          git diff --cached --quiet || git commit -m "دمج منع تداخل GPS وتحديث APK"
          git push origin HEAD:${{ github.ref_name }}
